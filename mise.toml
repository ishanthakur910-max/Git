[settings]
experimental = true

[tools]
python = "3.12.12"
uv = "0.5.31"
rust = { version = "1.97.0", profile = "default", components = ["rustfmt", "clippy", "llvm-tools-preview"] }
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-llvm-cov" = "0.8.7"
node = ["24.12.0", "22.23.2"]
pnpm = "9.15.9"
helm = "3.16.4"

[env]
MISE_CACHE_DIR = "{{config_root}}/.cache/mise"
MISE_CONFIG_DIR = "{{config_root}}/.cache/mise-config"
MISE_DATA_DIR = "{{config_root}}/.cache/mise-data"
MISE_GLOBAL_CONFIG_FILE = "{{config_root}}/.cache/mise-config/config.toml"
MISE_GLOBAL_CONFIG_ROOT = "{{config_root}}"
MISE_PROJECT_ROOT = "{{config_root}}"
MISE_TRUSTED_CONFIG_PATHS = "{{config_root}}:{{env.HOME}}/.config/mise"
MISE_IGNORED_CONFIG_PATHS = "{{env.HOME}}/.config/mise"
MISE_STATE_DIR = "{{config_root}}/.cache/mise-state"
MISE_SYSTEM_CONFIG_FILE = "{{config_root}}/.cache/mise-config/system.toml"
UV_CACHE_DIR = "{{env.HOME}}/.cache/sie/uv"
XDG_CACHE_HOME = "{{env.HOME}}/.cache/sie/xdg-cache"
XDG_CONFIG_HOME = "{{config_root}}/.cache/xdg-config"
XDG_STATE_HOME = "{{config_root}}/.cache/xdg-state"

[task_config]
includes = ["tools/mise_tasks"]
